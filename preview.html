    const { useState, useEffect, useRef } = React;

    // --- Cursor Follower Easter Egg ---
    const CursorFollower = () => {
      const dotRef = useRef(null);
      const ringRef = useRef(null);
      const mousePos = useRef({ x: -100, y: -100 });
      const dotPos = useRef({ x: -100, y: -100 });
      const ringPos = useRef({ x: -100, y: -100 });
      const [isHoveringClickable, setIsHoveringClickable] = useState(false);
      const [isVisible, setIsVisible] = useState(false);

      useEffect(() => {
        if (window.matchMedia('(pointer: coarse)').matches) return;
        let animId;

        const handleMouseMove = (e) => {
          mousePos.current.x = e.clientX;
          mousePos.current.y = e.clientY;
          if (!isVisible) setIsVisible(true);

          const target = e.target;
          if (
            target.closest('a') ||
            target.closest('button') ||
            target.closest('input') ||
            target.closest('textarea')
          ) {
            setIsHoveringClickable(true);
          } else {
            setIsHoveringClickable(false);
          }
        };

        const handleMouseLeave = () => setIsVisible(false);

        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseleave', handleMouseLeave);

        const render = () => {
          dotPos.current.x += (mousePos.current.x - dotPos.current.x) * 0.45;
          dotPos.current.y += (mousePos.current.y - dotPos.current.y) * 0.45;
          ringPos.current.x += (mousePos.current.x - ringPos.current.x) * 0.16;
          ringPos.current.y += (mousePos.current.y - ringPos.current.y) * 0.16;

          if (dotRef.current) {
            dotRef.current.style.transform = `translate3d(${dotPos.current.x}px, ${dotPos.current.y}px, 0px) translate(-50%, -50%)`;
          }
          if (ringRef.current) {
            ringRef.current.style.transform = `translate3d(${ringPos.current.x}px, ${ringPos.current.y}px, 0px) translate(-50%, -50%)`;
          }
          animId = requestAnimationFrame(render);
        };

        animId = requestAnimationFrame(render);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseleave', handleMouseLeave);
        };
      }, [isVisible]);

      return (
        <div className={`pointer-events-none fixed inset-0 z-50 transition-opacity duration-300 ${isVisible ? 'opacity-100' : 'opacity-0'}`}>
          <div
            ref={ringRef}
            className={`absolute top-0 left-0 rounded-full transition-[width,height,border-color,background-color] duration-200 ease-out will-change-transform ${
              isHoveringClickable
                ? 'w-10 h-10 border-2 border-lime-400/80 bg-emerald-500/15 shadow-[0_0_18px_rgba(163,230,53,0.45)]'
                : 'w-7 h-7 border border-emerald-400/50 bg-emerald-500/10 shadow-[0_0_12px_rgba(16,185,129,0.35)]'
            }`}
          />
          <div
            ref={dotRef}
            className={`absolute top-0 left-0 rounded-full bg-gradient-to-tr from-emerald-400 to-lime-300 will-change-transform transition-[width,height] duration-150 ${
              isHoveringClickable ? 'w-2.5 h-2.5 shadow-[0_0_12px_#a3e635]' : 'w-1.5 h-1.5 shadow-[0_0_8px_#10b981]'
            }`}
          />
        </div>
      );
    };

    // --- Matrix Dot Grid Canvas ---
    const MatrixGridCanvas = () => {
      const canvasRef = useRef(null);
      const mouseRef = useRef({ x: -1000, y: -1000, targetX: -1000, targetY: -1000 });

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouseRef.current.targetX = e.clientX - rect.left;
          mouseRef.current.targetY = e.clientY - rect.top;
        };

        const handleMouseLeave = () => {
          mouseRef.current.targetX = -1000;
          mouseRef.current.targetY = -1000;
        };

        window.addEventListener('resize', handleResize);
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        const spacing = 38;
        const interactionRadius = 180;
        let time = 0;

        const render = () => {
          time += 0.02;
          const mouse = mouseRef.current;
          mouse.x += (mouse.targetX - mouse.x) * 0.12;
          mouse.y += (mouse.targetY - mouse.y) * 0.12;

          ctx.clearRect(0, 0, width, height);

          ctx.fillStyle = '#0d1117';
          ctx.fillRect(0, 0, width, height);

          const ambientGlow = ctx.createRadialGradient(
            width / 2, height * 0.42, 0,
            width / 2, height * 0.42, width * 0.55
          );
          ambientGlow.addColorStop(0, 'rgba(16, 185, 129, 0.07)');
          ambientGlow.addColorStop(0.5, 'rgba(5, 150, 105, 0.025)');
          ambientGlow.addColorStop(1, 'rgba(13, 17, 23, 0)');
          ctx.fillStyle = ambientGlow;
          ctx.fillRect(0, 0, width, height);

          const cols = Math.ceil(width / spacing) + 2;
          const rows = Math.ceil(height / spacing) + 2;
          const startX = ((width % spacing) / 2) - spacing;
          const startY = ((height % spacing) / 2) - spacing;

          for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
              const originX = startX + i * spacing;
              const originY = startY + j * spacing;
              const wave = Math.sin(originX * 0.006 + time) * Math.cos(originY * 0.006 + time * 0.8) * 3;

              const dx = originX - mouse.x;
              const dy = originY - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              let posX = originX;
              let posY = originY + wave;
              let dotRadius = 1.35;
              let alpha = 0.18;
              let isHovered = false;

              if (dist < interactionRadius) {
                const power = (1 - dist / interactionRadius);
                const ripple = Math.sin(dist * 0.08 - time * 4) * 4 * power;
                const angle = Math.atan2(dy, dx);
                posX += Math.cos(angle) * (power * 16 + ripple);
                posY += Math.sin(angle) * (power * 16 + ripple);

                dotRadius = 1.35 + power * 2.8;
                alpha = 0.2 + power * 0.75;
                isHovered = power > 0.4;
              }

              ctx.beginPath();
              ctx.arc(posX, posY, dotRadius, 0, Math.PI * 2);

              if (isHovered) {
                const glow = ctx.createRadialGradient(posX, posY, 0, posX, posY, dotRadius * 2);
                glow.addColorStop(0, `rgba(163, 230, 53, ${alpha})`);
                glow.addColorStop(1, `rgba(16, 185, 129, ${alpha * 0.5})`);
                ctx.fillStyle = glow;
                ctx.shadowColor = '#10b981';
                ctx.shadowBlur = 8;
              } else {
                ctx.fillStyle = `rgba(16, 185, 129, ${alpha})`;
                ctx.shadowBlur = 0;
              }
              ctx.fill();

              if (dist < interactionRadius * 0.65) {
                const lineAlpha = (1 - dist / (interactionRadius * 0.65)) * 0.25;
                ctx.strokeStyle = `rgba(52, 211, 153, ${lineAlpha})`;
                ctx.lineWidth = 0.75;
                ctx.beginPath();
                ctx.moveTo(posX, posY);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.stroke();
              }
            }
          }

          ctx.shadowBlur = 0;

          const vignette = ctx.createRadialGradient(
            width / 2, height / 2, Math.min(width, height) * 0.35,
            width / 2, height / 2, Math.max(width, height) * 0.75
          );
          vignette.addColorStop(0, 'rgba(13, 17, 23, 0)');
          vignette.addColorStop(1, 'rgba(13, 17, 23, 0.75)');
          ctx.fillStyle = vignette;
          ctx.fillRect(0, 0, width, height);

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-auto z-0 select-none block w-full h-full" />;
    };

    const ProjectCard = ({ project, index }) => {
      const cardRef = useRef(null);
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const rotateX = -((y - rect.height / 2) / (rect.height / 2)) * 9;
        const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 9;
        cardRef.current.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-6px) scale3d(1.02, 1.02, 1.02)`;
      };

      const handleMouseLeave = () => {
        setIsHovered(false);
        if (cardRef.current) cardRef.current.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px) scale3d(1, 1, 1)';
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={handleMouseLeave}
          style={{ transition: isHovered ? 'box-shadow 0.3s ease-out' : 'transform 0.5s ease-out, box-shadow 0.4s ease-out' }}
          className={`group relative flex flex-col justify-between rounded-2xl p-6 sm:p-7

                      <div className="text-[10px] font-mono text-slate-400">GITHUB REPOSITORIES</div>
                      <div className="text-xs sm:text-sm font-semibold text-white">github.com/ananya-mu</div>
                    </div>
                  </a>
                  <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 p-3.5 rounded-2xl bg-[#080c12] border border-emerald-500/30 hover:border-emerald-400 hover:scale-105 transition-all">
                    <span className="text-xl">💼</span>
                    <div>
                      <div className="text-[10px] font-mono text-slate-400">LINKEDIN</div>
                      <div className="text-xs sm:text-sm font-semibold text-white">linkedin.com/in/ananya-mu</div>
                    </div>
                  </a>
                </div>
              </div>
            </div>

            <div className="lg:col-span-7 rounded-3xl p-6 sm:p-8 bg-[#0e131d]/90 border border-emerald-500/20 shadow-[0_10px_35px_rgba(0,0,0,0.6)]">
              <form onSubmit={handleSubmit} className="space-y-5">
                <div>
                  <label className="block text-xs font-mono font-semibold text-slate-300 mb-2">YOUR NAME *</label>
                  <input
                    type="text"
                    required
                    value={formData.name}
                    onChange={e => setFormData({ ...formData, name: e.target.value })}
                    placeholder="e.g., Alex Chen"
                    className="w-full px-4 py-3 rounded-xl bg-carbon-900 border border-emerald-500/25 text-white text-sm focus:outline-none focus:border-emerald-400"
                  />
                </div>
                <div>
                  <label className="block text-xs font-mono font-semibold text-slate-300 mb-2">YOUR EMAIL *</label>
                  <input
                    type="email"
                    required
                    value={formData.email}
                    onChange={e => setFormData({ ...formData, email: e.target.value })}
                    placeholder="e.g., alex@company.com"
                    className="w-full px-4 py-3 rounded-xl bg-carbon-900 border border-emerald-500/25 text-white text-sm focus:outline-none focus:border-emerald-400"
                  />
                </div>
                <div>
                  <label className="block text-xs font-mono font-semibold text-slate-300 mb-2">YOUR MESSAGE *</label>
                  <textarea
                    rows={4}
                    required
                    value={formData.message}
                    onChange={e => setFormData({ ...formData, message: e.target.value })}
                    placeholder="Hi Ananya, let's connect regarding a summer internship or collaboration..."
                    className="w-full px-4 py-3 rounded-xl bg-carbon-900 border border-emerald-500/25 text-white text-sm resize-none focus:outline-none focus:border-emerald-400"
                  />
                </div>
                <button
                  type="submit"
                  disabled={status === 'sending'}
                  className={`w-full py-3.5 px-6 rounded-xl font-bold text-sm sm:text-base flex items-center justify-center gap-2 transition-all ${
                    status === 'sent'
                      ? 'bg-emerald-500 text-carbon-950 shadow-[0_0_25px_rgba(16,185,129,0.7)]'
                      : status === 'sending'
                      ? 'bg-emerald-600/70 text-carbon-950 cursor-wait'
                      : 'bg-gradient-to-r from-emerald-400 to-lime-400 text-carbon-950 hover:shadow-[0_0_30px_rgba(16,185,129,0.75)] hover:-translate-y-0.5'
                  }`}
                >
                  {status === 'sending' && <span>Transmitting Message...</span>}
                  {status === 'sent' && <span>Message Sent! 🚀</span>}
                  {status === 'idle' && <span>Send Message 🚀</span>}
                </button>
              </form>
            </div>
          </div>
        </section>
      );
    };

    // --- Footer ---
    const Footer = () => {
      return (
        <footer className="relative z-10 border-t border-emerald-500/15 py-10 px-4 sm:px-6 bg-[#080c12]/90 backdrop-blur-xl">
          <div className="max-w-6xl mx-auto flex flex-col items-center justify-center gap-4 text-center">
            <button
              onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
              className="px-3 py-1.5 rounded-full text-xs font-mono text-emerald-400 bg-emerald-950/50 border border-emerald-500/30 hover:text-white"
            >
              ↑ Back to Top
            </button>
            <div className="text-sm sm:text-base font-medium text-slate-200 tracking-wide font-sans">
              Designed &amp; Engineered by <span className="text-emerald-400 font-semibold">Ananya MU</span> &bull; <span className="text-lime-300 font-mono text-xs sm:text-sm">Class of 2029</span>
            </div>
            <div className="text-xs font-mono text-slate-500">
              B.Tech in Artificial Intelligence &amp; Machine Learning &bull; K.S. Institute of Technology
            </div>
          </div>
        </footer>
      );
    };

    // --- Main App Root ---
    const App = () => {
      return (
        <div className="relative min-h-screen bg-[#0d1117] text-slate-100 font-sans">
          <MatrixGridCanvas />
          <CursorFollower />
          <div className="fixed inset-0 pointer-events-none z-1 cyber-scanlines opacity-25" />
          <Navbar />
          <main className="relative z-10">
            <Hero />
            <FeaturedProjects />
            <TechStackSkills />
            <EducationJourney />
            <ContactSection />
          </main>
          <Footer />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
